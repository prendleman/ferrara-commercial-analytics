# fly.toml for ferrara.datasharkbi.com
app = "ferrara-commercial-analytics"
primary_region = "ord"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8772"

[http_service]
  internal_port = 8772
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
